name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test .env
        run: |
          echo "BOT_TOKEN=0000000000:test_token_for_ci" >> .env
          echo "OWNER_USERNAME=testowner" >> .env
          echo "OWNER_CHAT_ID=123456789" >> .env

      - name: Run tests
        run: node --test

      - name: Verify bot starts
        run: timeout 5 node src/bot.js || true
